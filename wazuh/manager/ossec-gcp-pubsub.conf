<!--
  Bloque que activa el módulo gcp-pubsub de Wazuh.
  instalar_en_wazuh.sh lo añade solo al final de /var/ossec/etc/ossec.conf
  (Wazuh admite varios bloques <ossec_config> en el mismo archivo).
  __PROJECT_ID__ se reemplaza por el ID real del proyecto de GCP.
-->
<ossec_config>
  <gcp-pubsub>
    <enabled>yes</enabled>
    <pull_on_start>yes</pull_on_start>
    <interval>1m</interval>
    <project_id>__PROJECT_ID__</project_id>
    <subscription_name>wazuh-cloudrun-sub</subscription_name>
    <credentials_file>/var/ossec/wodles/gcloud/credentials.json</credentials_file>
    <max_messages>500</max_messages>
    <logging>info</logging>
  </gcp-pubsub>
</ossec_config>
