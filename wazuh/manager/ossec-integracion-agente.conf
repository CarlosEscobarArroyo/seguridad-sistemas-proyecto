<!--
  Bloque que envía al agente SOC las alertas RappiSim de nivel 10 o superior.
  instalar_integracion_agente.sh lo añade al final de /var/ossec/etc/ossec.conf.
  __AGENTE_URL__ se reemplaza por la URL del servicio de Cloud Run del agente.
-->
<ossec_config>
  <integration>
    <name>custom-agente-soc</name>
    <hook_url>__AGENTE_URL__/alertas</hook_url>
    <level>10</level>
    <group>rappisim</group>
    <alert_format>json</alert_format>
  </integration>
</ossec_config>
